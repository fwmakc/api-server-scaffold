name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api-server-scaffold

      # Dockerfile copies the toolkit from a sibling directory
      - uses: actions/checkout@v4
        with:
          repository: fwmakc/api-server-toolkit
          ref: v0.18.0
          path: api-server-toolkit

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-server-scaffold/Dockerfile
          push: false
