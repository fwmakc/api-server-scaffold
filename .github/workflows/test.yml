name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: my-service

      # Sibling checkouts must match the package.json pins — otherwise the
      # Docker build compiles against a stale toolkit and drifts every time
      # a dependency is bumped. ($GITHUB_ENV is visible only to subsequent
      # steps, so this runs before the sibling checkout.)
      - name: Resolve sibling pins from package.json
        run: |
          echo "TOOLKIT_REF=$(node -p "require('./my-service/package.json').dependencies['api-server-toolkit'].split('#')[1]")" >> $GITHUB_ENV

      # Dockerfile copies the toolkit from a sibling directory
      - uses: actions/checkout@v4
        with:
          repository: fwmakc/api-server-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: api-server-toolkit

      # dist/ is gitignored in the toolkit — build it for the Docker COPY
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build toolkit
        run: cd api-server-toolkit && npm install --legacy-peer-deps --ignore-scripts && npx tsc

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-service/Dockerfile
          push: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Runtime dependencies only; high/critical fails the build unless a
      # dated, justified allowlist entry exists in the script itself.
      - name: Dependency audit gate (high/critical, runtime)
        run: node scripts/audit-gate.mjs

      # Software bill of materials, shipped as a CI artifact on every push
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
